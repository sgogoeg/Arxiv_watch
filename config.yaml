# arXiv Radar configuration. See config.example.yaml for every option.

categories:
  - hep-ph
  - astro-ph
  - gr-qc

topics:
  - name: Phase transitions & GWs
    description: >-
      Cosmological first-order phase transitions, domain walls and other early-universe sources of a
      stochastic gravitational-wave background, and their signals at pulsar timing arrays such as NANOGrav.
    seed_ids: ["2305.02357v3", "2501.15649v2", "2403.09816"]
    keywords: []
    negative_keywords: []

authors: []

prefilter_top_n: 150
score_threshold: 0.5
author_backfill_days: 30

embedding:
  backend: sentence-transformers
  model: allenai/specter2_base

classifier:
  backend: setfit
  min_positives_per_topic: 3
  random_negatives: 100

summary:
  backend: flan-t5
  model: google/flan-t5-base
  top_k: 20

citations:
  enabled: true

github_branch: main
