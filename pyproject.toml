[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-radar"
version = "0.1.0"
description = "Personalized daily arXiv feed: local transfer-learning classifier, followed authors, citation tracker and a static dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local models: SPECTER2 embeddings, SetFit classifier, flan-t5 summaries.
# Install torch from the CPU index first on CI (see .github/workflows/daily.yml).
ml = [
  "sentence-transformers>=3.0",
  "setfit>=1.1",
  "transformers>=4.44",
  "scikit-learn>=1.4",
  "datasets>=2.19",
]
dev = ["pytest>=8"]

[project.scripts]
arxiv-radar = "arxiv_radar.__main__:main"

[tool.setuptools]
packages = ["arxiv_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the ML extras and downloads models"]
addopts = "-m 'not slow'"
