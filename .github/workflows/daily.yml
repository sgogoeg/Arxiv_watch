name: Daily arXiv run

on:
  schedule:
    # arXiv announces new papers around 00:00 UTC Sunday–Thursday evenings (US Eastern).
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = fetch and classify today's papers; refresh = only backfill authors, refresh citations, redeploy"
        type: choice
        options: [run, refresh]
        default: run
  # Dashboard syncs commit the data files; code and config changes also redeploy the site.
  push:
    branches: [main]
    paths:
      - site/**
      - arxiv_radar/**
      - config.yaml
      - data/authors.json
      - data/my_papers.json
      - data/library.json
      - data/feedback.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: arxiv-radar
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'schedule' && 'run' || github.event_name == 'push' && 'refresh' || inputs.mode }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check config
        run: |
          if [ ! -f config.yaml ]; then
            echo "::error::config.yaml is missing. Copy config.example.yaml to config.yaml, set your categories and topics, and commit it."
            exit 1
          fi

      - name: Restore models and classifier
        if: env.MODE == 'run'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache
          key: radar-${{ hashFiles('config.yaml') }}-${{ github.run_id }}
          restore-keys: |
            radar-${{ hashFiles('config.yaml') }}-
            radar-

      - name: Install
        run: |
          if [ "$MODE" = "run" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -e '.[ml]'
          else
            pip install -e .
          fi

      - name: Fetch, classify and summarize
        if: env.MODE == 'run'
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python -m arxiv_radar run

      - name: Refresh authors and citations
        if: env.MODE == 'refresh'
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python -m arxiv_radar refresh

      - name: Commit data
        run: |
          git config user.name "arxiv-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "Daily update ($MODE) $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Build site
        run: python -m arxiv_radar build-site --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
